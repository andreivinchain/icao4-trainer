<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1b2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ICAO 4 Trainer</title>
<style>
:root{
  --bg:#0d1b2a; --bg2:#13253a; --card:#1b3252; --card2:#22406a;
  --txt:#e8eef7; --muted:#9db2cc; --accent:#4da3ff; --accent2:#ffb703;
  --good:#3ddc84; --warn:#ffb703; --bad:#ff5c5c; --border:#2c4a75;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,Roboto,'Segoe UI',sans-serif;font-size:16px;line-height:1.5}
header{position:sticky;top:0;z-index:10;background:var(--bg2);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;padding:12px 14px}
header .back{background:none;border:1px solid var(--border);color:var(--txt);border-radius:10px;
  padding:6px 12px;font-size:15px;cursor:pointer}
header h1{font-size:17px;margin:0;font-weight:600;flex:1}
main{max-width:720px;margin:0 auto;padding:14px 14px 40px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode-card{cursor:pointer;text-align:left;border:1px solid var(--border);background:var(--card);
  border-radius:14px;padding:14px;color:var(--txt);font-family:inherit}
.mode-card:active{background:var(--card2)}
.mode-card .ico{font-size:26px}
.mode-card .t{font-weight:600;margin-top:6px}
.mode-card .d{font-size:13px;color:var(--muted);margin-top:2px}
.btn{display:inline-block;background:var(--accent);color:#04121f;border:none;border-radius:12px;
  padding:12px 18px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit}
.btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--border)}
.btn.small{padding:8px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
textarea,input,select{width:100%;background:var(--bg2);color:var(--txt);border:1px solid var(--border);
  border-radius:12px;padding:12px;font-size:16px;font-family:inherit}
textarea{min-height:140px;resize:vertical}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
.tag{display:inline-block;background:var(--bg2);border:1px solid var(--border);color:var(--muted);
  border-radius:20px;padding:3px 10px;font-size:12px;margin:2px 4px 2px 0}
.qtext{font-size:18px;font-weight:600;margin:8px 0}
.scenario{font-size:16px;background:var(--bg2);border-left:3px solid var(--accent2);
  border-radius:8px;padding:10px 12px;margin:8px 0}
.muted{color:var(--muted);font-size:14px}
.score-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.score{border:1px solid var(--border);border-radius:10px;padding:8px 10px;background:var(--bg2)}
.score .n{font-size:22px;font-weight:700}
.score .l{font-size:12px;color:var(--muted)}
.s-good{color:var(--good)} .s-warn{color:var(--warn)} .s-bad{color:var(--bad)}
.overall{font-size:17px;font-weight:700;padding:10px 12px;border-radius:10px;background:var(--bg2);
  border:1px solid var(--border);margin:10px 0}
details{border:1px solid var(--border);border-radius:12px;background:var(--card);margin-bottom:10px}
details summary{padding:12px 14px;cursor:pointer;font-weight:600;list-style:none}
details summary::after{content:"▾";float:right;color:var(--muted)}
details[open] summary::after{content:"▴"}
details .inner{padding:0 14px 12px}
.phrase{padding:8px 0;border-top:1px solid var(--border)}
.phrase b{color:var(--accent)}
.phrase .ex{font-size:14px;color:var(--muted)}
.flashcard{background:var(--card);border:1px solid var(--border);border-radius:16px;min-height:230px;
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
  padding:20px;cursor:pointer;margin-bottom:12px}
.flashcard .w{font-size:28px;font-weight:700}
.flashcard .cat{font-size:12px;color:var(--muted);margin-bottom:8px}
.flashcard .tr{font-size:20px;color:var(--accent2);font-weight:600}
.flashcard .mean{margin-top:8px}
.flashcard .ex{margin-top:10px;color:var(--muted);font-size:14px;font-style:italic}
.flashcard .mis{margin-top:10px;font-size:13px;color:var(--warn)}
.progress-bar{height:8px;background:var(--bg2);border-radius:4px;overflow:hidden;margin-top:4px}
.progress-bar div{height:100%;background:var(--accent)}
.attempt{border-top:1px solid var(--border);padding:10px 0;font-size:14px}
.err{color:var(--bad);font-size:14px;margin-top:8px}
.feedback h3{margin:14px 0 6px;font-size:15px;color:var(--accent)}
.feedback ul{margin:4px 0;padding-left:20px}
.model-answer{background:var(--bg2);border-left:3px solid var(--good);border-radius:8px;padding:10px 12px;margin:8px 0}
.spinner{display:inline-block;width:18px;height:18px;border:3px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.pill-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.pill{white-space:nowrap;background:var(--bg2);border:1px solid var(--border);color:var(--muted);
  border-radius:20px;padding:6px 14px;font-size:14px;cursor:pointer}
.pill.on{background:var(--accent);color:#04121f;border-color:var(--accent);font-weight:600}
.notice{font-size:12px;color:var(--muted);margin-top:20px;text-align:center}
.pic{width:100%;border-radius:12px;margin:8px 0;border:1px solid var(--border);background:var(--bg2);min-height:120px}
.mic{font-size:18px}
.mic.rec{background:var(--bad);border-color:var(--bad);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.feedback h3.sub,h3.sub{margin:10px 0 4px;font-size:14px;color:var(--accent)}
.trbox{background:var(--bg2);border-left:3px solid var(--accent2);border-radius:8px;padding:10px 12px;margin:8px 0;font-size:15px}
.opt{display:block;padding:8px 10px;margin-top:6px;border:1px solid var(--border);border-radius:10px;cursor:pointer;font-size:15px}
.opt:has(input:checked){border-color:var(--accent);background:var(--bg2)}
.lq{border-top:1px solid var(--border);margin-top:10px;padding-top:2px}
.drow{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-top:1px solid var(--border);cursor:pointer;font-size:15px}
.drow:first-child{border-top:none}
.drow.ddone{opacity:.55}
.drow.ddone b{color:var(--good)}
.fulink{padding:10px 12px;margin-top:6px;border:1px solid var(--border);border-radius:10px;cursor:pointer;font-size:15px;background:var(--bg2)}
.fulink:active{border-color:var(--accent)}
</style>
</head>
<body>
<header>
  <button class="back" id="backBtn" style="display:none">←</button>
  <h1 id="title">ICAO 4 Trainer</h1>
</header>
<main id="app"></main>
<script>
window.DATA_INTERVIEW_1 = [
  {
    id: "int-001",
    category: "Personal background",
    question: "Can you tell me about yourself and why you started flying?",
    level4Answer: "My name is Andrei and I am a private pilot. I live in Belarus and I also fly in Poland. I started flying three years ago. Aviation was my dream since childhood. One day a friend took me to a small airfield near Minsk. I had a short flight in a light aircraft and I loved it. After that flight I decided to start flight training. Now I fly a Viper SD4 and I enjoy every flight.",
    followUps: ["What do you do when you are not flying?", "Does your family support your flying?", "What was your first impression of flying?"],
    vocabulary: [
      {term: "private pilot", meaning: "a pilot who flies for personal reasons, not for money"},
      {term: "airfield", meaning: "a small airport, often with a grass or short runway"},
      {term: "light aircraft", meaning: "a small aeroplane with low weight and one or two engines"},
      {term: "flight training", meaning: "lessons to learn how to fly an aircraft"}
    ],
    grammarFocus: "Past Simple for completed events; Present Simple for facts about yourself",
    commonMistakes: [
      "I am pilot → I am a pilot",
      "I fly since three years → I have been flying for three years",
      "I decided start training → I decided to start training"
    ]
  },
  {
    id: "int-002",
    category: "Personal background",
    question: "What kind of flying do you do at the moment?",
    level4Answer: "At the moment I fly for pleasure, not for work. I fly a Viper SD4, a light two-seat aircraft. I fly only under visual flight rules, so I need good weather. I usually fly on weekends when the weather is fine. My flights are normally one or two hours long. I fly local flights around my home airfield and sometimes short cross-country flights. I also fly in Poland because the rules there follow EASA. My goal now is to get ICAO Level 4 and then convert my licence to an EASA PPL.",
    followUps: ["How many hours do you fly per month?", "Do you fly alone or with passengers?", "Why do you want an EASA licence?"],
    vocabulary: [
      {term: "visual flight rules (VFR)", meaning: "rules for flying with visual reference to the ground and good visibility"},
      {term: "cross-country flight", meaning: "a flight from one airfield to another airfield"},
      {term: "licence", meaning: "an official document that allows a pilot to fly"},
      {term: "convert", meaning: "to change a licence from one system to another"}
    ],
    grammarFocus: "Present Simple for habits and routines; adverbs of frequency (usually, sometimes, normally)",
    commonMistakes: [
      "I fly only in good weathers → I fly only in good weather",
      "I want get Level 4 → I want to get Level 4",
      "flights around home airfield → flights around my home airfield"
    ]
  },
  {
    id: "int-003",
    category: "Personal background",
    question: "Why is English important for you as a pilot?",
    level4Answer: "English is very important for my flying. It is the international language of aviation. I need English to talk to air traffic control, especially in Poland. Many controllers there do not speak Russian. I also need English to read aviation documents, charts and weather reports. Most aviation manuals and NOTAMs are in English. If I have a problem in flight, I must explain it clearly to the controller. Good English makes my flights safer. That is why I want to pass the ICAO Level 4 exam.",
    followUps: ["When did you start learning English?", "What is the most difficult part of aviation English for you?", "Have you ever had a communication problem in flight?"],
    vocabulary: [
      {term: "air traffic control (ATC)", meaning: "the ground service that manages aircraft in the air and on the ground"},
      {term: "NOTAM", meaning: "a notice with important information for pilots about a flight or airfield"},
      {term: "chart", meaning: "an aviation map used for navigation"},
      {term: "weather report", meaning: "official information about current weather conditions"}
    ],
    grammarFocus: "Present Simple with modal verbs (need to, must) for necessity",
    commonMistakes: [
      "English is international language → English is the international language",
      "I must to explain → I must explain",
      "informations about weather → information about the weather"
    ]
  },
  {
    id: "int-004",
    category: "Personal background",
    question: "What do you do for a living, and how does it fit with your flying?",
    level4Answer: "I work in an office during the week. My job gives me a stable income, and flying is my hobby. Flying is not cheap, so I plan my budget carefully. I usually fly on Saturdays and Sundays. In summer I take some days off to fly more. My job also taught me to be organised and careful. These skills help me in aviation too. In the future I would like to spend more time flying, maybe after I get my EASA licence and instrument rating.",
    followUps: ["Would you like to become a professional pilot?", "How much time can you give to flying each week?", "Is flying expensive in your country?"],
    vocabulary: [
      {term: "hobby", meaning: "an activity you do for pleasure in your free time"},
      {term: "instrument rating (IR)", meaning: "a qualification that allows a pilot to fly in clouds using instruments"},
      {term: "day off", meaning: "a day when you do not work"},
      {term: "budget", meaning: "a plan for how to spend your money"}
    ],
    grammarFocus: "Present Simple for routines; 'would like to' for future wishes",
    commonMistakes: [
      "I work in office → I work in an office",
      "flying is not cheap hobby → flying is not a cheap hobby",
      "I would like spend more time → I would like to spend more time"
    ]
  },
  {
    id: "int-005",
    category: "Personal background",
    question: "Where do you usually fly from? Describe your home airfield.",
    level4Answer: "My home airfield is a small airfield near Minsk. It has one grass runway, about 800 metres long. There is no control tower, so pilots use a common radio frequency. We report our position and intentions to other traffic. The airfield has several hangars and a small clubhouse. My Viper SD4 is parked in one of the hangars. The area around the airfield is flat, with fields and small forests. It is a good place for VFR flying. I also fly from an airfield in Poland when I train there.",
    followUps: ["Is the runway paved or grass?", "What kind of traffic operates at your airfield?", "Are there any obstacles near the runway?"],
    vocabulary: [
      {term: "runway", meaning: "a strip of ground where aircraft take off and land"},
      {term: "hangar", meaning: "a building where aircraft are kept"},
      {term: "frequency", meaning: "a radio channel used for communication"},
      {term: "traffic", meaning: "other aircraft flying or moving in the same area"},
      {term: "obstacle", meaning: "an object like a mast or trees that can be dangerous for aircraft"}
    ],
    grammarFocus: "There is / There are for describing places",
    commonMistakes: [
      "It has one grass runway 800 metres length → The runway is about 800 metres long",
      "There is no tower, pilots uses radio → There is no tower, so pilots use the radio",
      "airfield near of Minsk → airfield near Minsk"
    ]
  },
  {
    id: "int-006",
    category: "Personal background",
    question: "What are your aviation goals for the next few years?",
    level4Answer: "I have three main goals. First, I want to pass the ICAO Level 4 English exam. Second, I plan to convert my licence to an EASA PPL. This will let me fly legally in the whole European Union. Third, after the PPL, I want to start training for an instrument rating. With an IR I will be able to fly in clouds and in worse weather. I also want to fly to new countries, for example the Czech Republic and Lithuania. Step by step, I want to become a safer and more experienced pilot.",
    followUps: ["Which goal is the most difficult, in your opinion?", "How long will the PPL conversion take?", "Why do you need an instrument rating?"],
    vocabulary: [
      {term: "PPL", meaning: "Private Pilot Licence, the basic licence for private flying"},
      {term: "EASA", meaning: "the European aviation safety agency that makes rules for European pilots"},
      {term: "conversion", meaning: "the process of changing a licence to a different system"},
      {term: "experienced", meaning: "having a lot of practice and knowledge"}
    ],
    grammarFocus: "Future forms: 'want to', 'plan to', 'will' for goals and predictions",
    commonMistakes: [
      "I will can fly in clouds → I will be able to fly in clouds",
      "This will let me to fly → This will let me fly",
      "more safer pilot → a safer pilot"
    ]
  },
  {
    id: "int-007",
    category: "Personal background",
    question: "What do you enjoy most about flying?",
    level4Answer: "I enjoy the feeling of freedom most of all. When I climb after takeoff, all my problems stay on the ground. I love the view from the cockpit. From two thousand feet the fields and lakes look beautiful. I also enjoy the technical side of flying. I like planning the route, checking the weather and calculating the fuel. Every flight is a small project. And I like landing, because a good landing gives me real satisfaction. Flying makes me calm and happy.",
    followUps: ["Is there anything you do not like about flying?", "Do you prefer flying alone or with someone?", "What was your most beautiful flight?"],
    vocabulary: [
      {term: "cockpit", meaning: "the part of the aircraft where the pilot sits"},
      {term: "takeoff", meaning: "the moment when the aircraft leaves the ground"},
      {term: "climb", meaning: "to go up to a higher altitude"},
      {term: "route", meaning: "the planned way from departure to destination"}
    ],
    grammarFocus: "Verb + -ing after 'enjoy', 'like', 'love' (I enjoy flying, I like planning)",
    commonMistakes: [
      "I enjoy to fly → I enjoy flying",
      "the view from cockpit → the view from the cockpit",
      "good landing gives me satisfaction → a good landing gives me satisfaction"
    ]
  },
  {
    id: "int-008",
    category: "Personal background",
    question: "Have you ever been afraid during a flight?",
    level4Answer: "Yes, once I was quite nervous. It was one of my first solo flights. During the flight the wind became stronger than the forecast. On final approach the aircraft moved a lot because of turbulence. My hands were wet and my heart was beating fast. But I remembered my training. I kept the speed correct and stayed on the centreline. The landing was firm but safe. After that flight I felt more confident. Now I respect the weather even more.",
    followUps: ["What did you learn from that experience?", "How do you control stress in the cockpit?", "Would you do anything differently now?"],
    vocabulary: [
      {term: "solo flight", meaning: "a flight when the student pilot flies alone, without an instructor"},
      {term: "final approach", meaning: "the last part of the flight before landing"},
      {term: "turbulence", meaning: "rough, unstable air that shakes the aircraft"},
      {term: "centreline", meaning: "the line in the middle of the runway"},
      {term: "forecast", meaning: "a prediction of future weather"}
    ],
    grammarFocus: "Past Simple and Past Continuous for describing a past experience (my heart was beating)",
    commonMistakes: [
      "I was afraid one time in my first solo → I was afraid once, on one of my first solo flights",
      "wind became more stronger → the wind became stronger",
      "I keeped the speed → I kept the speed"
    ]
  },
  {
    id: "int-009",
    category: "Personal background",
    question: "How do you keep your flying skills and knowledge up to date?",
    level4Answer: "I try to fly regularly, at least two or three times a month. Regular practice is the best way to keep skills. In winter, when I fly less, I study theory at home. I read about navigation, meteorology and regulations. I also watch training videos about flight safety. Sometimes I fly with an instructor to check my technique. Before every flight I review the checklists and the emergency procedures. I also practise my aviation English, for example with this training. Learning never stops for a pilot.",
    followUps: ["When did you last fly with an instructor?", "What subject do you study most?", "How do you practise emergency procedures?"],
    vocabulary: [
      {term: "checklist", meaning: "a list of actions a pilot must complete in the correct order"},
      {term: "emergency procedure", meaning: "the correct actions for a dangerous situation"},
      {term: "meteorology", meaning: "the science of weather"},
      {term: "regulations", meaning: "official aviation rules"}
    ],
    grammarFocus: "Present Simple with frequency expressions (two or three times a month, before every flight)",
    commonMistakes: [
      "I fly two-three times in month → I fly two or three times a month",
      "I read about navigation and meteorology theory → I study navigation and meteorology theory",
      "Learning never stop → Learning never stops"
    ]
  },
  {
    id: "int-010",
    category: "Personal background",
    question: "Tell me about the aviation community at your airfield.",
    level4Answer: "We have a small but friendly community at my airfield. There are about twenty active pilots. Most of them fly light aircraft like mine. Some pilots fly gliders and one pilot has a small helicopter. We help each other a lot. Experienced pilots share advice with new pilots. On weekends we often sit together after flights and talk about aviation. We also help with small maintenance jobs, for example washing the aircraft or checking tyre pressure. This community is one of the reasons I love my airfield.",
    followUps: ["Do you organise any events together?", "How do experienced pilots help beginners?", "Is general aviation popular in your country?"],
    vocabulary: [
      {term: "general aviation", meaning: "all civil flying except airlines and military"},
      {term: "glider", meaning: "an aircraft without an engine that uses rising air to fly"},
      {term: "maintenance", meaning: "work done to keep an aircraft in good technical condition"},
      {term: "tyre pressure", meaning: "the amount of air inside a wheel tyre"}
    ],
    grammarFocus: "Quantifiers: most of them, some, about twenty, a lot",
    commonMistakes: [
      "Most of them flies light aircraft → Most of them fly light aircraft",
      "We help each other much → We help each other a lot",
      "one pilot has small helicopter → one pilot has a small helicopter"
    ]
  },
  {
    id: "int-011",
    category: "Personal background",
    question: "How do you prepare yourself physically and mentally for flying?",
    level4Answer: "Good preparation starts the day before the flight. I try to sleep at least seven or eight hours. I never fly if I feel sick or very tired. I also never drink alcohol before flying, of course. On the day of the flight I eat a normal breakfast and drink enough water. Before I go to the airfield, I check the weather and NOTAMs. This mental preparation is important. At the aircraft I take a few minutes to focus and forget other problems. A calm and rested pilot makes better decisions.",
    followUps: ["What do you do if you feel tired before a planned flight?", "Do you use any personal checklist like IMSAFE?", "How does stress affect pilot performance?"],
    vocabulary: [

      {term: "fatigue", meaning: "strong tiredness that reduces performance"},
      {term: "decision", meaning: "a choice you make after thinking"},
      {term: "performance", meaning: "how well a person or machine works"}
    ],
    grammarFocus: "Present Simple with 'never', 'always' for personal rules",
    commonMistakes: [
      "I never fly if I am feeling sick → I never fly if I feel sick",
      "I sleep minimum seven hours → I sleep at least seven hours",
      "calm pilot makes better decisions → a calm pilot makes better decisions"
    ]
  },
  {
    id: "int-012",
    category: "Flight training",
    question: "Where did you do your flight training and how long did it take?",
    level4Answer: "I did my basic flight training at a small flight school near Minsk. The training took about one year. I started with theory classes in winter. We studied aerodynamics, navigation, meteorology and regulations. In spring I started practical flying with an instructor. First we flew simple exercises: climbs, descents, turns and stalls. Then we practised many circuits and landings. My first solo flight was after about fifteen hours. Later I also trained at an airfield in Poland to learn EASA procedures. In total, my basic course took around fifty flight hours.",
    followUps: ["What subject was the most difficult in theory?", "How many landings did you do before solo?", "What was different about training in Poland?"],
    vocabulary: [
      {term: "flight school", meaning: "an organisation that trains pilots"},
      {term: "circuit", meaning: "the standard rectangular pattern flown around a runway"},
      {term: "stall", meaning: "a loss of lift when the wing angle is too high and speed is too low"},
      {term: "descent", meaning: "going down to a lower altitude"},
      {term: "instructor", meaning: "a qualified pilot who teaches students"}
    ],
    grammarFocus: "Past Simple for a sequence of completed events (started, studied, flew, practised)",
    commonMistakes: [
      "The training took me one year time → The training took about one year",
      "We flew simple exercises like climb, descent → We flew simple exercises such as climbs and descents",
      "after fifteen hours flying → after about fifteen hours of flying"
    ]
  },
  {
    id: "int-013",
    category: "Flight training",
    question: "Tell me about your first solo flight.",
    level4Answer: "I remember my first solo flight very well. It was a sunny morning with light wind. My instructor and I flew three circuits together. Then he told me to stop on the taxiway. He got out and said: 'Now fly one circuit alone.' I was nervous but also very happy. The aircraft climbed faster without the instructor's weight. I flew the circuit carefully and reported every position on the radio. My landing was quite soft, maybe my best landing at that time. After the flight my hands were shaking a little. It was one of the best days of my life.",
    followUps: ["How did the aircraft feel different without the instructor?", "What did your instructor say after the flight?", "Were you ready for it, in your opinion?"],
    vocabulary: [
      {term: "taxiway", meaning: "a path on the ground that connects the runway with the apron"},
      {term: "downwind", meaning: "the circuit leg parallel to the runway, flown in the opposite direction to landing"},
      {term: "report", meaning: "to give information on the radio"},
      {term: "light wind", meaning: "weak wind, usually good for training"}
    ],
    grammarFocus: "Past Simple for storytelling; direct speech (He said: 'Now fly alone.')",
    commonMistakes: [
      "He said me to fly alone → He told me to fly alone",
      "I was flying the circuit carefully and landed → I flew the circuit carefully and landed",
      "one of the best day → one of the best days"
    ]
  },
  {
    id: "int-014",

  {word: "mayday", translation: "сигнал бедствия МЭЙДЭЙ", aviationMeaning: "the international radio distress call for life-threatening emergencies", example: "The pilot transmitted 'Mayday' three times after the engine stopped.", commonMistake: "Always spoken three times: 'Mayday, Mayday, Mayday' — and only for grave danger", category: "Emergency"},

  // --- ATC ---

  {word: "transponder", translation: "ответчик", aviationMeaning: "equipment that sends your code and altitude to radar", example: "The controller asked me to check my transponder because he had no return.", commonMistake: "Stress on the second syllable: /trænˈspɒndə/", category: "ATC"},

  {word: "say again", translation: "повторите", aviationMeaning: "the standard phrase asking to repeat a message", example: "Say again all after 'wind', please.", commonMistake: "On the radio say 'say again', never 'repeat' — 'repeat' has a military artillery meaning", category: "ATC"},

  {word: "hold short", translation: "остановиться перед (ВПП)", aviationMeaning: "to stop before the runway and not enter it", example: "Hold short of runway three one, traffic on final.", commonMistake: "'Hold short OF runway' — do not drop the preposition 'of'", category: "ATC"},
  {word: "line up and wait", translation: "занять исполнительный и ждать", aviationMeaning: "enter the runway, get ready, but do not take off yet", example: "Line up and wait, runway two five, departing traffic ahead.", commonMistake: "It is NOT a take-off clearance — you must wait for 'cleared for take-off'", category: "ATC"},

  {word: "callsign", translation: "позывной", aviationMeaning: "the name that identifies an aircraft on the radio", example: "My callsign was shortened by the controller after the first contact.", commonMistake: "Do not shorten your own callsign first — wait until the controller does it", category: "ATC"},

  {word: "unable", translation: "не могу выполнить", aviationMeaning: "the standard word for refusing an instruction you cannot comply with", example: "Unable to climb to six thousand feet due to clouds.", commonMistake: "Say simply 'unable', not 'I cannot do it' or 'it is impossible' on the radio", category: "ATC"},

  // --- Navigation ---

  {word: "track", translation: "путевая линия, линия пути", aviationMeaning: "the actual path of the aircraft over the ground", example: "Because of the wind my track was ten degrees left of my heading.", commonMistake: "False friend: not a 'трек' from music apps — in navigation it is your path over the ground", category: "Navigation"},

  {word: "waypoint", translation: "путевая точка", aviationMeaning: "a defined point on the route used for navigation", example: "My next waypoint was the railway bridge over the river.", commonMistake: "One word: 'waypoint', not 'way point' or 'route point'", category: "Navigation"},

  {word: "alternate", translation: "запасной аэродром", aviationMeaning: "another airfield chosen in case landing at the destination is impossible", example: "I always plan an alternate with enough fuel to reach it.", commonMistake: "As a noun the stress is /ˈɔːltənət/; do not say 'reserve aerodrome' (literal 'запасной')", category: "Navigation"},
  {word: "dead reckoning", translation: "счисление пути", aviationMeaning: "navigation by heading, speed and time without radio aids", example: "When the GPS failed, I continued by dead reckoning and my chart.", commonMistake: "Nothing to do with 'dead' people — do not translate literally; it is a navigation method", category: "Navigation"},
  {word: "chart", translation: "аэронавигационная карта", aviationMeaning: "an aviation map showing airspace, obstacles and airfields", example: "I marked my route on the chart the evening before the flight.", commonMistake: "Aviation maps are 'charts', not 'maps' — 'map' sounds unprofessional in the test", category: "Navigation"},
  {word: "airspace", translation: "воздушное пространство", aviationMeaning: "a defined part of the sky with rules for flying", example: "I asked for clearance before entering the controlled airspace.", commonMistake: "One word and uncountable: 'airspace', not 'air space' or 'airspaces'", category: "Navigation"},
  {word: "altitude", translation: "высота (по давлению QNH)", aviationMeaning: "the height of the aircraft above mean sea level", example: "I maintained an altitude of three thousand five hundred feet.", commonMistake: "Altitude (above sea level) vs height (above ground) vs elevation (of the ground) — examiners love this trio", category: "Navigation"},
  {word: "elevation", translation: "превышение аэродрома", aviationMeaning: "the height of the ground or an airfield above sea level", example: "The field elevation is nine hundred and eighty feet.", commonMistake: "Elevation is for the GROUND, not the aircraft — do not say 'my elevation was 3000 feet'", category: "Navigation"},

<script>
"use strict";
/* ================= ICAO 4 Trainer — app logic (v2) ================= */
var ALL_INTERVIEW = (window.DATA_INTERVIEW_1||[]).concat(window.DATA_INTERVIEW_2||[]);
var ALL_EMERGENCY = window.DATA_EMERGENCY||[];
var PHRASES = window.DATA_PHRASES||[];
var VOCAB = (function(){
  var seen={}, out=[];
  (window.DATA_VOCAB||[]).concat(window.DATA_VOCAB_2||[], window.DATA_VOCAB_3||[]).forEach(function(v){
    var k=v.word.toLowerCase();
    if(!seen[k]){ seen[k]=1; out.push(v); }
  });
  return out;
})();
var PICTURES = window.DATA_PICTURES||[];
var LISTENING = window.DATA_LISTENING||[];
var RT = window.DATA_RT||[];

var DEFAULT_PROFILE = "Private pilot, 110 flight hours total, all on Viper SD4 (light single-engine piston, Rotax 912, 2 seats, fixed gear). VFR only. Flies in Belarus and Poland (EASA context). Goal: ICAO Level 4, then EASA PPL conversion and IR.";

var CRITERIA = [
  {key:"structure", label:"Structure"},
  {key:"vocabulary", label:"Vocabulary"},
  {key:"fluency", label:"Fluency"},
  {key:"comprehension", label:"Comprehension"},
  {key:"interaction", label:"Interaction"}
];

/* ---------- storage ---------- */
function loadJSON(k,d){ try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;} }
function saveJSON(k,v){ localStorage.setItem(k,JSON.stringify(v)); }
var settings = loadJSON("icao4_settings",{provider:"anthropic",apiKey:"",model:"",profile:DEFAULT_PROFILE});
var attempts = loadJSON("icao4_attempts",[]);
var vocabState = loadJSON("icao4_vocab",{});
var listenStats = loadJSON("icao4_listening",{});
var trCache = loadJSON("icao4_tr",{});
var rtStats = loadJSON("icao4_rt",{});
var fuCache = loadJSON("icao4_fu",{});
var timeStats = loadJSON("icao4_time",{});
if(!settings.minMinutes) settings.minMinutes=20;

/* ---------- study time tracking ---------- */
var lastActivity=Date.now();
["click","keydown","touchstart","scroll"].forEach(function(ev){
  document.addEventListener(ev,function(){ lastActivity=Date.now(); },true);
});
setInterval(function(){
  if(document.visibilityState==="visible" && Date.now()-lastActivity<120000){
    var t=todayStr();
    timeStats[t]=(timeStats[t]||0)+30;
    saveJSON("icao4_time",timeStats);
    if(daily&&daily.date===t&&!daily.completed) checkDailyComplete();
  }
},30000);
function todayMinutes(){ return Math.floor((timeStats[todayStr()]||0)/60); }

/* ---------- PWA: service worker + напоминания ---------- */
if(settings.reminderHour==null) settings.reminderHour=19;
var swReg=null;
var IS_PWA=("serviceWorker" in navigator)&&location.protocol==="https:";
if(IS_PWA){
  navigator.serviceWorker.register("sw.js").then(function(r){
    swReg=r; sendReminderCfg(); registerPeriodic();
  }).catch(function(){});
}
function sendReminderCfg(){
  var msg={type:"cfg",reminderHour:settings.reminderHour,enabled:settings.reminderOn!==false};
  if(navigator.serviceWorker&&navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage(msg);
  else if(swReg&&swReg.active) swReg.active.postMessage(msg);
}
function registerPeriodic(){
  if(swReg&&("periodicSync" in swReg)){
    swReg.periodicSync.register("icao4-reminder",{minInterval:6*3600*1000}).catch(function(){});
  }
}
function askNotifPermission(cb){
  if(!("Notification" in window)){ cb("unsupported"); return; }
  Notification.requestPermission().then(cb);
}
var dailyMeta = loadJSON("icao4_daily_meta",{streak:0,lastDone:null});
var daily = loadJSON("icao4_daily",null);

/* ---------- daily plan ---------- */
function todayStr(){ var d=new Date(); return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
function seededRand(seed){
  var h=0; for(var i=0;i<seed.length;i++){ h=(Math.imul(31,h)+seed.charCodeAt(i))|0; }
  return function(){ h=(Math.imul(48271,h)+11)|0; return ((h>>>0)%100000)/100000; };
}
function pickSeeded(arr,n,rnd,excludeMap){
  var pool=arr.filter(function(x){ return !excludeMap||!excludeMap[x.id]; });
  if(pool.length<n) pool=arr.slice(); else pool=pool.slice();
  var out=[];
  while(out.length<n&&pool.length){ out.push(pool.splice(Math.floor(rnd()*pool.length),1)[0]); }
  return out;
}
function getDaily(){
  var t=todayStr();
  if(daily&&daily.date===t) return daily;
  var rnd=seededRand(t);
  var done=answeredIds();
  var learn=VOCAB.filter(function(v){return vocabState[v.word]==="learn";});
  var unseen=VOCAB.filter(function(v){return !vocabState[v.word];});
  var nl=Math.min(5,learn.length);
  var words=pickSeeded(learn,nl,rnd).concat(pickSeeded(unseen.length?unseen:VOCAB,10-nl,rnd))
    .map(function(v){return v.word;})
    .filter(function(w,i,a){return a.indexOf(w)===i;});
  var tasks=[];
  pickSeeded(ALL_INTERVIEW,3,rnd,done).forEach(function(q){tasks.push({mode:"interview",id:q.id});});
  pickSeeded(ALL_EMERGENCY,2,rnd,done).forEach(function(q){tasks.push({mode:"emergency",id:q.id});});
  pickSeeded(PICTURES,1,rnd,done).forEach(function(q){tasks.push({mode:"picture",id:q.id});});
  pickSeeded(LISTENING,1,rnd,listenStats).forEach(function(q){tasks.push({mode:"listening",id:q.id});});
  pickSeeded(RT,1,rnd,rtStats).forEach(function(q){tasks.push({mode:"rt",id:q.id});});
  daily={date:t,words:words,wordsDone:{},tasks:tasks,done:{},completed:false};
  saveJSON("icao4_daily",daily);
  return daily;
}
function dailyDone(id){
  if(!daily||daily.date!==todayStr())return;
  var base=String(id).replace(/-fu\d*$/,"");
  if(daily.done[base])return;
  var hit=daily.tasks.some(function(tk){return tk.id===base;});
  if(hit){ daily.done[base]=true; saveJSON("icao4_daily",daily); checkDailyComplete(); }
}
function dailyWordDone(word){
  if(!daily||daily.date!==todayStr())return;
  if(daily.words.indexOf(word)>=0&&!daily.wordsDone[word]){
    daily.wordsDone[word]=true; saveJSON("icao4_daily",daily); checkDailyComplete();
  }
}
function checkDailyComplete(){
  if(daily.completed)return;
  var allT=daily.tasks.every(function(tk){return daily.done[tk.id];});
  var allW=daily.words.every(function(w){return daily.wordsDone[w];});
  if(allT&&allW&&todayMinutes()>=settings.minMinutes){
    daily.completed=true; saveJSON("icao4_daily",daily);
    var y=new Date(Date.now()-86400000);
    var ys=y.getFullYear()+"-"+("0"+(y.getMonth()+1)).slice(-2)+"-"+("0"+y.getDate()).slice(-2);
    dailyMeta.streak=(dailyMeta.lastDone===ys)?dailyMeta.streak+1:1;
    dailyMeta.lastDone=todayStr();
    saveJSON("icao4_daily_meta",dailyMeta);
  }
}
function dailyProgress(){
  var d=getDaily();
  var t=d.tasks.filter(function(tk){return d.done[tk.id];}).length;
  var w=d.words.filter(function(x){return d.wordsDone[x];}).length;
  return {done:t+(w>=d.words.length?1:0), total:d.tasks.length+1, words:w, wordsTotal:d.words.length};
}

/* ---------- navigation / helpers ---------- */
var appEl=document.getElementById("app"), titleEl=document.getElementById("title"), backBtn=document.getElementById("backBtn");
backBtn.onclick=function(){ stopMic(); speechSynthesis.cancel(); renderHome(); };
function setScreen(t,showBack){ titleEl.textContent=t; backBtn.style.display=showBack?"":"none"; appEl.innerHTML=""; window.scrollTo(0,0); }
function el(html){ var d=document.createElement("div"); d.innerHTML=html; return d; }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* ---------- speech: mic input ---------- */
var recog=null, recogTarget=null, recogBtn=null;
function micSupported(){ return !!(window.SpeechRecognition||window.webkitSpeechRecognition); }
function stopMic(){ if(recog){ try{recog.stop();}catch(e){} recog=null; if(recogBtn)recogBtn.classList.remove("rec"); recogBtn=null; recogTarget=null; } }
function toggleMic(ta,btn){
  if(recog){ stopMic(); return; }
  if(!micSupported()){ alert("Голосовой ввод не поддерживается этим браузером. Используйте Chrome на Android."); return; }
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  recog=new SR(); recogTarget=ta; recogBtn=btn;
  recog.lang="en-US"; recog.continuous=true; recog.interimResults=true;
  var base=ta.value?ta.value.replace(/\s+$/,"")+" ":"";
  recog.onresult=function(ev){
    var fin="", interim="";
    for(var i=0;i<ev.results.length;i++){
      if(ev.results[i].isFinal) fin+=ev.results[i][0].transcript+" ";
      else interim+=ev.results[i][0].transcript;
    }
    ta.value=base+fin+interim;
  };
  recog.onend=function(){ if(recogBtn)recogBtn.classList.remove("rec"); recog=null; };
  recog.onerror=function(ev){ if(ev.error==="not-allowed") alert("Нет доступа к микрофону. Разрешите доступ в настройках браузера."); stopMic(); };
  btn.classList.add("rec");
  recog.start();
}
function micBtnHtml(id){ return '<button class="btn sec mic" id="'+id+'" title="Голосовой ввод">🎤</button>'; }

/* ---------- speech: TTS ---------- */
function speak(text){
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text);
  u.lang="en-US"; u.rate=0.92;
  var vs=speechSynthesis.getVoices().filter(function(v){return v.lang.indexOf("en")===0;});
  if(vs.length)u.voice=vs.find(function(v){return v.lang==="en-US";})||vs[0];
  speechSynthesis.speak(u);
}
function ttsBtnHtml(id){ return '<button class="btn sec small" id="'+id+'">🔊 Послушать</button>'; }
function playDialog(dialog,rate){
  speechSynthesis.cancel();
  var vs=speechSynthesis.getVoices().filter(function(v){return v.lang.indexOf("en")===0;});
  var vAtc=null,vPlt=null;
  if(vs.length){
    var gb=null,us=null;
    vs.forEach(function(v){ if(!gb&&v.lang==="en-GB")gb=v; if(!us&&v.lang==="en-US")us=v; });
    vAtc=gb||vs[0]; vPlt=us||(vs.length>1?vs[1]:vs[0]);
  }
  dialog.forEach(function(l){
    var u=new SpeechSynthesisUtterance(l.text);
    u.lang="en-US"; u.rate=rate||1;
    if(l.speaker==="ATC"||l.speaker==="ATIS"){ if(vAtc)u.voice=vAtc; u.pitch=0.8; }
    else { if(vPlt)u.voice=vPlt; u.pitch=1.15; }
    speechSynthesis.speak(u);
  });
}
if(window.speechSynthesis){ speechSynthesis.onvoiceschanged=function(){}; speechSynthesis.getVoices(); }

/* ---------- translation ---------- */
function toggleTranslate(key,text,box,btn){
  if(box.style.display!=="none"){ box.style.display="none"; return; }
  if(trCache[key]){ box.innerHTML=esc(trCache[key]).replace(/\n/g,"<br>"); box.style.display=""; return; }
  if(!settings.apiKey.trim()){ box.innerHTML='<span class="err">Для перевода нужен API-ключ (Настройки).</span>'; box.style.display=""; return; }
  btn.disabled=true; box.innerHTML='<span class="spinner"></span> Перевожу…'; box.style.display="";
  callAI("Translate the following aviation English text into natural Russian. Use accepted Russian aviation terminology. Output ONLY the translation, nothing else.\n\n"+text,null,1500)
    .then(function(t){ trCache[key]=t.trim(); saveJSON("icao4_tr",trCache); box.innerHTML=esc(trCache[key]).replace(/\n/g,"<br>"); })
    .catch(function(e){ box.innerHTML='<span class="err">Ошибка перевода: '+esc(e.message)+'</span>'; })
    .finally(function(){ btn.disabled=false; });
}

/* ---------- home ---------- */
function weakestCriterion(){
  if(!attempts.length) return null;
  var sums={},cnt={};
  attempts.slice(-20).forEach(function(a){
    CRITERIA.forEach(function(c){
      var s=a.scores&&a.scores[c.key];
      if(typeof s==="number"){ sums[c.key]=(sums[c.key]||0)+s; cnt[c.key]=(cnt[c.key]||0)+1; }
    });
  });
  var worst=null,worstAvg=99;
  CRITERIA.forEach(function(c){
    if(cnt[c.key]){ var avg=sums[c.key]/cnt[c.key]; if(avg<worstAvg){worstAvg=avg;worst=c.label;} }
  });
  return worst?{label:worst,avg:worstAvg}:null;
}
function renderHome(){
  setScreen("ICAO 4 Trainer",false);

function modeCard(m,ico,t,d){ return '<button class="mode-card" data-m="'+m+'"><div class="ico">'+ico+'</div><div class="t">'+t+'</div><div class="d">'+d+'</div></button>'; }

/* ---------- training (interview / emergency) ---------- */
var trainState={mode:"interview",cat:{interview:"Все",emergency:"Все",picture:"Все"},item:null};
function itemsFor(mode){ return mode==="interview"?ALL_INTERVIEW:(mode==="picture"?PICTURES:ALL_EMERGENCY); }
function cats(mode){
  var s=[]; itemsFor(mode).forEach(function(q){ if(s.indexOf(q.category)<0)s.push(q.category); });
  return ["Все"].concat(s);
}
function getCat(mode){
  var c=trainState.cat[mode]||"Все";
  if(c!=="Все"&&cats(mode).indexOf(c)<0)c="Все"; // защита от невалидной категории
  trainState.cat[mode]=c;
  return c;
}
function answeredIds(){ var s={}; attempts.forEach(function(a){s[a.qid]=1;}); return s; }
function pickItem(mode){
  var cat=getCat(mode);
  var pool=itemsFor(mode).filter(function(q){ return cat==="Все"||q.category===cat; });
  if(!pool.length) pool=itemsFor(mode);
  var done=answeredIds();
  var fresh=pool.filter(function(q){ return !done[q.id]; });
  var src=fresh.length?fresh:pool;
  return src[Math.floor(Math.random()*src.length)];
}
function catPills(mode,onPick){
  var pills='<div class="pill-row">'+cats(mode).map(function(c){
    return '<span class="pill'+(c===getCat(mode)?" on":"")+'" data-c="'+esc(c)+'">'+esc(c)+'</span>';
  }).join("")+'</div>';
  var pr=el(pills);
  pr.querySelectorAll(".pill").forEach(function(p){
    p.onclick=function(){ trainState.cat[mode]=p.dataset.c; onPick(); };
  });
  return pr;
}
function renderTraining(mode,item){
  stopMic();
  trainState.mode=mode;
  trainState.item=item||pickItem(mode);
  setScreen(mode==="interview"?"Interview":"Emergency Scenario",true);
  var q=trainState.item;
  if(!q){ appEl.appendChild(el('<div class="card">Нет вопросов.</div>')); return; }
  appEl.appendChild(catPills(mode,function(){renderTraining(mode);}));

  var body='<div class="card">'+
    '<span class="tag">'+esc(q.category)+'</span>'+
    (mode==="emergency"
      ? '<div class="scenario">'+esc(q.scenario)+'</div><div class="qtext">'+esc(q.firstQuestion)+'</div>'
      : '<div class="qtext">'+esc(q.question)+'</div>')+
    '<div class="btnrow" style="margin-top:4px"><button class="btn sec small" id="trBtn">🇷🇺 Перевод</button></div>'+
    '<div id="trBox" class="trbox" style="display:none"></div>'+
    '<label>Ваш ответ (по-английски). Скажите вслух — 🎤 запишет за вас:</label>'+
    '<textarea id="answer" placeholder="Tap the mic and speak, or type your answer..."></textarea>'+
    '<div class="btnrow">'+
      micBtnHtml("micBtn")+
      '<button class="btn" id="checkBtn">Проверить (AI)</button>'+
      '<button class="btn sec" id="modelBtn">Образец L4</button>'+
      '<button class="btn sec" id="nextBtn">Другой</button>'+
    '</div>'+
    '<div id="modelBox" style="display:none"></div>'+
    '<div id="fbBox"></div>'+
  '</div>';
  var card=el(body);
  appEl.appendChild(card);
  card.querySelector("#micBtn").onclick=function(){ toggleMic(card.querySelector("#answer"),this); };
  card.querySelector("#trBtn").onclick=function(){
    var txt=mode==="emergency"?(q.scenario+"\n"+q.firstQuestion):q.question;
    toggleTranslate(q.id+":q",txt,card.querySelector("#trBox"),this);
  };
  card.querySelector("#nextBtn").onclick=function(){ renderTraining(mode); };
  card.querySelector("#modelBtn").onclick=function(){ toggleModel(q,mode,card); };
  card.querySelector("#checkBtn").onclick=function(){ checkAnswer(q,mode,card,null); };
}
function toggleModel(q,mode,card){
  var box=card.querySelector("#modelBox");
  if(box.style.display!=="none"){ box.style.display="none"; speechSynthesis.cancel(); return; }
  var vocab=(q.vocabulary||[]).map(function(v){return '<span class="tag">'+esc(v.term)+' — '+esc(v.meaning)+'</span>';}).join("");
  var extra="";
  if(mode==="emergency"){
    extra='<h3 class="sub">Risks</h3><ul>'+(q.risks||[]).map(function(r){return "<li>"+esc(r)+"</li>";}).join("")+'</ul>'+
    '<h3 class="sub">Actions</h3><ul>'+(q.actions||[]).map(function(r){return "<li>"+esc(r)+"</li>";}).join("")+'</ul>';
  } else if(mode==="picture"){
    extra='<h3 class="sub">Risks</h3><ul>'+(q.risks||[]).map(function(r){return "<li>"+esc(r)+"</li>";}).join("")+'</ul>';
  } else {
    extra=(q.grammarFocus?'<div class="muted" style="margin-top:8px">Grammar focus: '+esc(q.grammarFocus)+'</div>':'')+
      (q.commonMistakes&&q.commonMistakes.length?'<h3 class="sub">Типичные ошибки</h3><ul>'+q.commonMistakes.map(function(m){return "<li>"+esc(m)+"</li>";}).join("")+'</ul>':'');
  }
  var fus=q.followUps||q.examinerQuestions||[];
  var fu=fus.map(function(f,i){return '<div class="fulink" data-i="'+i+'">'+esc(f)+' <span class="muted">→</span></div>';}).join("");
  box.innerHTML='<div class="model-answer">'+esc(q.level4Answer)+'</div>'+
    '<div class="btnrow" style="margin-top:6px">'+ttsBtnHtml("ttsModel")+'<button class="btn sec small" id="trModel">🇷🇺 Перевод</button></div>'+
    '<div id="trMBox" class="trbox" style="display:none"></div>'+
    '<div style="margin-top:6px">'+vocab+'</div>'+extra+
    (fu?'<h3 class="sub">Возможные follow-up вопросы <span class="muted" style="font-weight:400">(нажмите, чтобы потренировать)</span></h3>'+fu:'');
  box.style.display="";
  box.querySelector("#ttsModel").onclick=function(){ speak(q.level4Answer); };
  box.querySelector("#trModel").onclick=function(){ toggleTranslate(q.id+":m",q.level4Answer,box.querySelector("#trMBox"),this); };
  box.querySelectorAll(".fulink").forEach(function(f){
    f.onclick=function(){ renderFollowUp(q,mode,fus[parseInt(f.dataset.i,10)],parseInt(f.dataset.i,10)); };
  });
}

/* ---------- follow-up training ---------- */
function fuOrigin(q,mode){
  return mode==="emergency"?(q.scenario+" — "+q.firstQuestion):(mode==="picture"?q.prompt:q.question);
}
function renderFollowUp(q,mode,fuText,fuIdx){
  stopMic(); speechSynthesis.cancel();
  setScreen("Follow-up",true);
  var qFu=Object.assign({},q,{question:fuText,firstQuestion:fuText,prompt:fuText,scenario:q.scenario,id:q.id+"-fu"+fuIdx});
  var card=el('<div class="card">'+
    '<span class="tag">'+esc(q.category)+'</span> <span class="tag">Follow-up</span>'+
    '<div class="muted" style="font-size:13px;margin-top:6px">К вопросу: '+esc(fuOrigin(q,mode))+'</div>'+
    '<div class="qtext">'+esc(fuText)+'</div>'+
    '<div class="btnrow" style="margin-top:4px">'+
      '<button class="btn sec small" id="fuTts">🔊</button>'+
      '<button class="btn sec small" id="trBtn">🇷🇺 Перевод</button></div>'+
    '<div id="trBox" class="trbox" style="display:none"></div>'+
    '<label>Ваш ответ:</label>'+
    '<textarea id="answer" placeholder="Speak or type your answer..."></textarea>'+
    '<div class="btnrow">'+micBtnHtml("micBtn")+
      '<button class="btn" id="checkBtn">Проверить (AI)</button>'+
      '<button class="btn sec" id="fuModelBtn">Образец L4</button>'+
      '<button class="btn sec" id="backQ">← К вопросу</button></div>'+
    '<div id="fuModelBox" style="display:none"></div>'+
    '<div id="fbBox"></div></div>');
  appEl.appendChild(card);
  card.querySelector("#fuTts").onclick=function(){ speak(fuText); };
  card.querySelector("#trBtn").onclick=function(){ toggleTranslate(qFu.id+":q",fuText,card.querySelector("#trBox"),this); };
  card.querySelector("#micBtn").onclick=function(){ toggleMic(card.querySelector("#answer"),this); };
  card.querySelector("#backQ").onclick=function(){
    if(mode==="picture")renderPicture(q); else renderTraining(mode,q);
  };
  card.querySelector("#checkBtn").onclick=function(){ checkAnswer(qFu,mode,card,mode==="picture"?q.imageUrl:null); };
  card.querySelector("#fuModelBtn").onclick=function(){
    var box=card.querySelector("#fuModelBox"), btn=this;
    if(box.style.display!=="none"){ box.style.display="none"; return; }
    var key=qFu.id+":model";
    function show(txt){
      box.innerHTML='<div class="model-answer">'+esc(txt)+'</div>'+
        '<div class="btnrow" style="margin-top:6px"><button class="btn sec small" id="fuMTts">🔊 Послушать</button>'+
        '<button class="btn sec small" id="fuMTr">🇷🇺 Перевод</button></div>'+
        '<div id="fuMTrBox" class="trbox" style="display:none"></div>';
      box.style.display="";
      box.querySelector("#fuMTts").onclick=function(){ speak(txt); };
      box.querySelector("#fuMTr").onclick=function(){ toggleTranslate(key+":tr",txt,box.querySelector("#fuMTrBox"),this); };
    }
    if(fuCache[key]){ show(fuCache[key]); return; }
    if(!settings.apiKey.trim()){ box.innerHTML='<div class="err">Для генерации образца нужен API-ключ (Настройки).</div>'; box.style.display=""; return; }
    btn.disabled=true;
    box.innerHTML='<div class="muted"><span class="spinner"></span> Готовлю образец…</div>'; box.style.display="";
    var prompt="You write model answers for the ICAO English Level 4 (Operational) speaking exam.\n"+
      "Candidate profile: "+settings.profile+"\n"+
      "Original examiner question/task: "+fuOrigin(q,mode)+"\n"+
      "Model answer to the original question (context): "+q.level4Answer+"\n\n"+
      "The examiner now asks a FOLLOW-UP question: \""+fuText+"\"\n\n"+
      "Write ONLY the model Level 4 answer to this follow-up: 6-10 short simple sentences, first person, natural spoken English, no idioms, no complex grammar, correct aviation logic, consistent with the profile and the context above. No preamble, no quotes.";
    callAI(prompt,null,1200).then(function(t){
      fuCache[key]=t.trim(); saveJSON("icao4_fu",fuCache); show(fuCache[key]);
    }).catch(function(e){
      box.innerHTML='<div class="err">Ошибка: '+esc(e.message)+'</div>';
    }).finally(function(){ btn.disabled=false; });
  };
}

/* ---------- AI feedback ---------- */
function taskText(q,mode){
  if(mode==="emergency") return "Scenario given to the candidate: "+q.scenario+"\nExaminer question: "+q.firstQuestion;
  if(mode==="picture") return "Picture description task. The candidate must describe the attached aviation photo following this logic: what you see, what is happening, what may have happened before, what may happen next, risks, what the pilot/crew/ATC should do.\nReference description of the photo (for you, the examiner): "+q.level4Answer;
  return "Examiner question: "+q.question;
}
function buildPrompt(q,mode,answer){
  return "You are a strict but fair ICAO English Language Proficiency examiner assessing a candidate who needs ICAO Level 4 (Operational).\n\n"+
  "Candidate profile: "+settings.profile+"\n\n"+
  taskText(q,mode)+"\n\nCandidate's answer (transcribed speech or typed text):\n\"\"\"\n"+answer+"\n\"\"\"\n\n"+
  "Assess using the ICAO Language Proficiency Rating Scale. Pronunciation cannot be judged from text — skip it. Rate these 5 criteria from 1 to 6: structure, vocabulary, fluency (sentence flow, connectors), comprehension (did they address the task), interaction.\n"+
  "The overall level is the LOWEST of the rated criteria (standard ICAO LPR rule).\n\n"+
  "Also: find aviation/terminology errors, correct grammar mistakes, and produce an improved Level 4 version of the candidate's own answer (simple natural English, no idioms, 6-10 short sentences, keep the candidate's ideas).\n\n"+
  "Reply with ONLY valid JSON, no markdown fences, exactly this shape:\n"+
  '{"scores":{"structure":4,"vocabulary":4,"fluency":4,"comprehension":4,"interaction":4},'+
  '"explanations":{"structure":"...","vocabulary":"...","fluency":"...","comprehension":"...","interaction":"..."},'+
  '"overall_level":4,'+
  '"grammar_corrections":["wrong → correct"],'+
  '"aviation_errors":["..."],'+
  '"improved_answer":"...",'+
  '"advice":"one short paragraph: the most important thing to improve",'+
  '"follow_up_question":"one natural examiner follow-up question"}';
}
function callAI(prompt,imageUrl,maxTokens){
  var p=settings.provider, key=settings.apiKey.trim();
  if(!key) return Promise.reject(new Error("NO_KEY"));
  var mt=maxTokens||2000;
  if(p==="anthropic"){
    var model=settings.model.trim()||"claude-sonnet-5";
    var content=imageUrl
      ? [{type:"image",source:{type:"url",url:imageUrl}},{type:"text",text:prompt}]
      : prompt;
    return fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"content-type":"application/json","x-api-key":key,
        "anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:model,max_tokens:mt,messages:[{role:"user",content:content}]})
    }).then(function(r){ if(!r.ok)return r.text().then(function(t){throw new Error("API "+r.status+": "+t.slice(0,200));});
      return r.json(); }).then(function(j){ return j.content[0].text; });
  } else {
    var model2=settings.model.trim()||"gpt-4o-mini";
    var content2=imageUrl
      ? [{type:"image_url",image_url:{url:imageUrl}},{type:"text",text:prompt}]
      : prompt;
    return fetch("https://api.openai.com/v1/chat/completions",{
      method:"POST",
      headers:{"content-type":"application/json","authorization":"Bearer "+key},
      body:JSON.stringify({model:model2,messages:[{role:"user",content:content2}],max_tokens:mt})
    }).then(function(r){ if(!r.ok)return r.text().then(function(t){throw new Error("API "+r.status+": "+t.slice(0,200));});
      return r.json(); }).then(function(j){ return j.choices[0].message.content; });
  }
}
function callAIWithImageFallback(prompt,imageUrl,maxTokens){
  if(!imageUrl) return callAI(prompt,null,maxTokens);
  return callAI(prompt,imageUrl,maxTokens).catch(function(e){
    // если провайдер не смог скачать картинку — оцениваем по референс-описанию
    return callAI(prompt,null,maxTokens);
  });
}
function parseAI(text){
  var t=text.trim().replace(/^```(json)?/,"").replace(/```$/,"").trim();
  var a=t.indexOf("{"), b=t.lastIndexOf("}");
  if(a<0||b<0) throw new Error("Не удалось разобрать ответ AI");
  return JSON.parse(t.slice(a,b+1));
}
function scoreClass(s){ return s>=4?"s-good":(s>=3?"s-warn":"s-bad"); }
function renderFeedback(r,overall){
  var sg='<div class="score-grid">'+CRITERIA.map(function(c){
    var s=r.scores[c.key];
    return '<div class="score"><div class="n '+scoreClass(s)+'">'+esc(s)+'</div><div class="l">'+c.label+'</div>'+
      (r.explanations&&r.explanations[c.key]?'<div class="muted" style="font-size:12px;margin-top:4px">'+esc(r.explanations[c.key])+'</div>':'')+'</div>';
  }).join("")+'</div>';
  var html='<div class="feedback">'+
    '<div class="overall">Итог: <span class="'+scoreClass(overall)+'">Level '+overall+'</span> <span class="muted" style="font-weight:400">(по самому слабому критерию)</span></div>'+sg;
  if(r.grammar_corrections&&r.grammar_corrections.length)
    html+='<h3>Исправления грамматики</h3><ul>'+r.grammar_corrections.map(function(x){return "<li>"+esc(x)+"</li>";}).join("")+'</ul>';
  if(r.aviation_errors&&r.aviation_errors.length)
    html+='<h3>Авиационные ошибки</h3><ul>'+r.aviation_errors.map(function(x){return "<li>"+esc(x)+"</li>";}).join("")+'</ul>';
  if(r.improved_answer)
    html+='<h3>Ваш ответ, доведённый до Level 4</h3><div class="model-answer">'+esc(r.improved_answer)+'</div>'+
      '<div class="btnrow" style="margin-top:6px"><button class="btn sec small tts-improved">🔊 Послушать</button></div>';
  if(r.advice) html+='<h3>Главный совет</h3><div>'+esc(r.advice)+'</div>';
  return html;
}
function checkAnswer(q,mode,card,imageUrl){
  stopMic();
  var ans=card.querySelector("#answer").value.trim();
  var fb=card.querySelector("#fbBox");
  if(ans.split(/\s+/).length<15){ fb.innerHTML='<div class="err">Слишком короткий ответ. Постарайтесь дать 6–10 предложений (минимум ~15 слов).</div>'; return; }
  if(!settings.apiKey.trim()){
    fb.innerHTML='<div class="err">Не задан API-ключ. Откройте Настройки и вставьте ключ Anthropic или OpenAI.</div>'; return;
  }
  var btn=card.querySelector("#checkBtn");
  btn.disabled=true;
  fb.innerHTML='<div class="muted" style="margin-top:10px"><span class="spinner"></span> Экзаменатор оценивает ответ…</div>';
  callAIWithImageFallback(buildPrompt(q,mode,ans),imageUrl).then(function(text){
    var r=parseAI(text);
    var mins=CRITERIA.map(function(c){return r.scores[c.key];}).filter(function(x){return typeof x==="number";});
    var overall=mins.length?Math.min.apply(null,mins):(r.overall_level||0);
    attempts.push({qid:q.id,mode:mode,answer:ans,scores:r.scores,overall:overall,ts:Date.now()});
    saveJSON("icao4_attempts",attempts);
    dailyDone(q.id);
    var html=renderFeedback(r,overall);
    if(r.follow_up_question){
      html+='<h3>Follow-up от экзаменатора</h3><div class="qtext" style="font-size:16px">'+esc(r.follow_up_question)+'</div>'+

var mock=null;
function renderMockIntro(){
  setScreen("Mock Exam",true);
  appEl.appendChild(el('<div class="card">'+
    '<b>Симуляция экзамена ICAO (~15–20 минут)</b>'+
    '<div class="muted" style="margin-top:8px">'+
    'Part 1 — Interview: 3 вопроса<br>'+
    'Part 2 — Picture description: 1 задание<br>'+
    'Part 3 — Emergency / discussion: 2 сценария<br><br>'+

    '<div class="btnrow"><button class="btn" id="startMock">Начать экзамен</button></div>'+
    '</div>'));
  appEl.querySelector("#startMock").onclick=startMock;
}
function pickN(arr,n){
  var pool=arr.slice(), out=[];
  while(out.length<n&&pool.length) out.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  return out;
}
function startMock(){
  if(!settings.apiKey.trim()){ alert("Для Mock Exam нужен API-ключ (Настройки)."); return; }
  var iv=pickN(ALL_INTERVIEW,3), pc=pickN(PICTURES,1), em=pickN(ALL_EMERGENCY,2);
  mock={tasks:[],idx:0,answers:[],started:Date.now()};
  iv.forEach(function(q){mock.tasks.push({part:"Part 1 — Interview",mode:"interview",q:q});});
  pc.forEach(function(q){mock.tasks.push({part:"Part 2 — Picture",mode:"picture",q:q});});
  em.forEach(function(q){mock.tasks.push({part:"Part 3 — Emergency",mode:"emergency",q:q});});
  renderMockTask();
}
function renderMockTask(){
  stopMic();
  var t=mock.tasks[mock.idx];
  setScreen("Mock Exam · "+(mock.idx+1)+"/"+mock.tasks.length,true);
  var q=t.q, inner="";
  if(t.mode==="interview") inner='<div class="qtext">'+esc(q.question)+'</div>';
  else if(t.mode==="picture") inner='<img class="pic" src="'+esc(q.imageUrl)+'" alt="picture"><div class="qtext">'+esc(q.prompt)+'</div>';
  else inner='<div class="scenario">'+esc(q.scenario)+'</div><div class="qtext">'+esc(q.firstQuestion)+'</div>';
  var mins=Math.floor((Date.now()-mock.started)/60000);
  var card=el('<div class="card">'+
    '<div class="muted">'+esc(t.part)+' · '+mins+' мин</div>'+inner+
    '<label>Ваш ответ:</label><textarea id="answer"></textarea>'+
    '<div class="btnrow">'+micBtnHtml("micBtn")+
    '<button class="btn" id="nextTask">'+(mock.idx===mock.tasks.length-1?"Завершить экзамен":"Следующий вопрос →")+'</button></div>'+
    '<div id="fbBox"></div></div>');
  appEl.appendChild(card);
  card.querySelector("#micBtn").onclick=function(){ toggleMic(card.querySelector("#answer"),this); };
  card.querySelector("#nextTask").onclick=function(){
    var ans=card.querySelector("#answer").value.trim();
    if(ans.split(/\s+/).length<10){ card.querySelector("#fbBox").innerHTML='<div class="err">Ответ слишком короткий — на экзамене молчание = Level 1. Скажите хотя бы несколько предложений.</div>'; return; }
    stopMic();
    mock.answers.push(ans);
    mock.idx++;
    if(mock.idx<mock.tasks.length) renderMockTask();
    else finishMock();
  };
}
function finishMock(){
  setScreen("Mock Exam — результат",true);
  appEl.appendChild(el('<div class="card"><div class="muted"><span class="spinner"></span> Экзаменатор оценивает все ответы… (~30–60 сек)</div></div>'));
  var parts=mock.tasks.map(function(t,i){
    return "TASK "+(i+1)+" ("+t.part+")\n"+taskText(t.q,t.mode)+"\nCANDIDATE'S ANSWER:\n"+mock.answers[i];
  }).join("\n\n---\n\n");
  var prompt="You are an ICAO English Language Proficiency examiner. The candidate (profile: "+settings.profile+") has completed a mock exam with "+mock.tasks.length+" tasks. Assess the WHOLE exam.\n\n"+parts+
  "\n\nRate the candidate's overall performance across all answers on 5 criteria (1-6): structure, vocabulary, fluency, comprehension, interaction (pronunciation is not rated from text). Overall level = LOWEST criterion (ICAO LPR rule).\n"+
  "Reply with ONLY valid JSON, no markdown fences:\n"+
  '{"scores":{"structure":4,"vocabulary":4,"fluency":4,"comprehension":4,"interaction":4},'+
  '"explanations":{"structure":"...","vocabulary":"...","fluency":"...","comprehension":"...","interaction":"..."},'+
  '"overall_level":4,'+
  '"per_task":[{"task":1,"level":4,"comment":"one sentence"}],'+
  '"main_errors":["..."],'+
  '"weak_points":["..."],'+
  '"homework":["3-5 concrete practice tasks"],'+
  '"verdict":"2-3 sentences: pass probability for Level 4 and what to focus on"}';
  callAI(prompt,null,4000).then(function(text){
    var r=parseAI(text);
    var mins2=CRITERIA.map(function(c){return r.scores[c.key];}).filter(function(x){return typeof x==="number";});
    var overall=mins2.length?Math.min.apply(null,mins2):(r.overall_level||0);
    mock.tasks.forEach(function(t,i){
      attempts.push({qid:t.q.id,mode:"mock",answer:mock.answers[i],scores:r.scores,overall:overall,ts:Date.now()});

    saveJSON("icao4_attempts",attempts);
    appEl.innerHTML="";
    var html='<div class="card feedback">'+
      '<div class="overall">Прогноз: <span class="'+scoreClass(overall)+'">Level '+overall+'</span></div>'+
      '<div class="score-grid">'+CRITERIA.map(function(c){
        var s=r.scores[c.key];
        return '<div class="score"><div class="n '+scoreClass(s)+'">'+esc(s)+'</div><div class="l">'+c.label+'</div>'+
          (r.explanations&&r.explanations[c.key]?'<div class="muted" style="font-size:12px;margin-top:4px">'+esc(r.explanations[c.key])+'</div>':'')+'</div>';
      }).join("")+'</div>';
    if(r.verdict) html+='<h3>Вердикт</h3><div>'+esc(r.verdict)+'</div>';
    if(r.per_task&&r.per_task.length)
      html+='<h3>По заданиям</h3><ul>'+r.per_task.map(function(x){return "<li>Task "+esc(x.task)+": <b class='"+scoreClass(x.level)+"'>L"+esc(x.level)+"</b> — "+esc(x.comment)+"</li>";}).join("")+'</ul>';
    if(r.main_errors&&r.main_errors.length)
      html+='<h3>Главные ошибки</h3><ul>'+r.main_errors.map(function(x){return "<li>"+esc(x)+"</li>";}).join("")+'</ul>';
    if(r.weak_points&&r.weak_points.length)
      html+='<h3>Слабые места</h3><ul>'+r.weak_points.map(function(x){return "<li>"+esc(x)+"</li>";}).join("")+'</ul>';
    if(r.homework&&r.homework.length)
      html+='<h3>Домашнее задание</h3><ul>'+r.homework.map(function(x){return "<li>"+esc(x)+"</li>";}).join("")+'</ul>';
    html+='<div class="btnrow"><button class="btn" id="mockAgain">Ещё раз</button><button class="btn sec" id="mockHome">На главную</button></div></div>';
    appEl.appendChild(el(html));
    appEl.querySelector("#mockAgain").onclick=renderMockIntro;
    appEl.querySelector("#mockHome").onclick=renderHome;
  }).catch(function(e){
    appEl.innerHTML="";
    appEl.appendChild(el('<div class="card"><div class="err">Ошибка оценки: '+esc(e.message)+'</div><div class="btnrow"><button class="btn" id="retryMock">Повторить оценку</button></div></div>'));
    appEl.querySelector("#retryMock").onclick=finishMock;
  });
}
