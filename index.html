function rtNextHtml(){
  return '<div class="btnrow"><button class="btn" id="rtNext">'+
    (rtState.idx===rtState.sc.steps.length-1?"Завершить полёт":"Далее →")+'</button></div>';
}
function rtBindNext(fb){
  fb.querySelector("#rtNext").onclick=function(){
    rtState.idx++;
    if(rtState.idx<rtState.sc.steps.length) renderRTStep();
    else finishRT();
  };
}
function rtCheck(st,card){
  stopMic();
  var ans=card.querySelector("#answer").value.trim();
  var fb=card.querySelector("#fbBox");
  if(ans.split(/\s+/).length<3){ fb.innerHTML='<div class="err">Слишком короткая передача.</div>'; return; }
  var sc=rtState.sc;
  if(!settings.apiKey.trim()){
    // офлайн-режим: самопроверка по образцу
    rtState.results.push({phase:st.phase,verdict:"self"});
    fb.innerHTML='<div class="model-answer"><b>Образец:</b> '+esc(st.expected)+'</div>'+
      '<div class="muted" style="font-size:13px">Обязательные элементы: '+st.mustInclude.map(esc).join(", ")+'. Сравните сами (для AI-проверки нужен ключ в Настройках).</div>'+rtNextHtml();
    rtBindNext(fb); return;
  }
  var btn=card.querySelector("#txBtn"); btn.disabled=true;
  fb.innerHTML='<div class="muted" style="margin-top:10px"><span class="spinner"></span> Проверяю передачу…</div>';
  var prompt="You are a radiotelephony instructor checking ICAO/SERA phraseology of a student pilot (VFR, light aircraft).\n"+
    "Flight: "+sc.title+" ("+sc.route+"). Callsign: "+sc.callsign+" (short: "+sc.callsignShort+").\n"+
    "Phase: "+st.phase+".\n"+
    (st.atcText?("ATC just transmitted: \""+st.atcText+"\"\n"):"The pilot initiates this call.\n")+
    "Required elements in the transmission: "+st.mustInclude.join(", ")+".\n"+
    "Model transmission: \""+st.expected+"\"\n\n"+
    "Student's transmission (from speech recognition — ignore punctuation/case; digits like 120.5 are equivalent to spoken 'one two zero decimal five'):\n\"\"\"\n"+ans+"\n\"\"\"\n\n"+
    "Judge: are all required elements present, is the readback correct (numbers!), is phraseology standard? Minor wording differences are fine if meaning and required elements are correct.\n"+
    "Reply ONLY valid JSON:\n"+
    '{"verdict":"good","missing":["..."],"errors":["wrong → correct"],"corrected":"the student\'s transmission fixed to standard phraseology","comment":"одно предложение по-русски: главное замечание или похвала"}'+
    "\nverdict must be exactly one of: good (all elements, correct numbers), partial (works but missing elements or nonstandard), poor (wrong/unsafe readback or missing critical items).";
  callAI(prompt,null,1200).then(function(text){
    var r=parseAI(text);
    rtState.results.push({phase:st.phase,verdict:r.verdict});
    var vcls=r.verdict==="good"?"s-good":(r.verdict==="partial"?"s-warn":"s-bad");
    var vlbl=r.verdict==="good"?"✓ Принято":(r.verdict==="partial"?"± Частично":"✗ Неверно");
    var html='<div class="overall"><span class="'+vcls+'">'+vlbl+'</span>'+
      (r.comment?' <span class="muted" style="font-weight:400">— '+esc(r.comment)+'</span>':'')+'</div>';
    if(r.missing&&r.missing.length) html+='<div class="err">Пропущено: '+r.missing.map(esc).join(", ")+'</div>';
    if(r.errors&&r.errors.length) html+='<ul>'+r.errors.map(function(x){return "<li>"+esc(x)+"</li>";}).join("")+'</ul>';
    if(r.corrected) html+='<div class="model-answer">'+esc(r.corrected)+'</div>'+
      '<div class="btnrow" style="margin-top:4px"><button class="btn sec small" id="rtSay">🔊</button></div>';
    html+='<details style="margin-top:8px"><summary style="font-size:14px">Образец из сценария</summary><div class="inner">'+esc(st.expected)+'</div></details>'+rtNextHtml();
    fb.innerHTML=html;
    var s=fb.querySelector("#rtSay"); if(s)s.onclick=function(){ speak(r.corrected); };
    rtBindNext(fb);
  }).catch(function(e){
    fb.innerHTML='<div class="err">Ошибка: '+esc(e.message)+'</div>';
  }).finally(function(){ btn.disabled=false; });
}
function finishRT(){
  speechSynthesis.cancel();
  var sc=rtState.sc, res=rtState.results;
  var good=res.filter(function(r){return r.verdict==="good";}).length;
  var partial=res.filter(function(r){return r.verdict==="partial";}).length;
  var selfMode=res.some(function(r){return r.verdict==="self";});
  var pct=selfMode?100:Math.round((good+partial*0.5)/res.length*100);
  if(!selfMode){ rtStats[sc.id]={pct:pct,ts:Date.now()}; saveJSON("icao4_rt",rtStats); }
  dailyDone(sc.id);
  setScreen("Полёт завершён",true);
  var rows=res.map(function(r,i){
    var v=r.verdict==="good"?'<b class="s-good">✓</b>':(r.verdict==="partial"?'<b class="s-warn">±</b>':(r.verdict==="self"?'<b class="muted">—</b>':'<b class="s-bad">✗</b>'));
    return '<div class="attempt">'+v+' '+(i+1)+'. '+esc(r.phase)+'</div>';
  }).join("");
  appEl.appendChild(el('<div class="card">'+
    '<div class="overall">'+esc(sc.title)+(selfMode?'':': <span class="'+(pct>=80?"s-good":(pct>=50?"s-warn":"s-bad"))+'">'+pct+'%</span>')+'</div>'+
    rows+
    '<div class="btnrow"><button class="btn" id="rtAgain">Ещё раз</button>'+
    '<button class="btn sec" id="rtList">К сценариям</button></div></div>'));
  appEl.querySelector("#rtAgain").onclick=function(){ startRT(sc); };
  appEl.querySelector("#rtList").onclick=renderRTList;
}

/* ---------- listening ---------- */
var listenState={cat:"Все",item:null,rate:0.9};
function listenCats(){ var s=[]; LISTENING.forEach(function(t){ if(s.indexOf(t.category)<0)s.push(t.category); }); return ["Все"].concat(s); }
function pickListening(){
  var pool=LISTENING.filter(function(t){ return listenState.cat==="Все"||t.category===listenState.cat; });
  if(!pool.length) pool=LISTENING;
  var fresh=pool.filter(function(t){ return !listenStats[t.id]; });
  var src=fresh.length?fresh:pool;
  return src[Math.floor(Math.random()*src.length)];
}
function diffDots(d){ return "●".repeat(d)+"○".repeat(3-d); }
function renderListening(item){
  stopMic(); speechSynthesis.cancel();
  listenState.item=item||pickListening();
  setScreen("Listening",true);
  var t=listenState.item;
  if(!t){ appEl.appendChild(el('<div class="card">Нет заданий.</div>')); return; }
  var pills='<div class="pill-row">'+listenCats().map(function(c){
    return '<span class="pill'+(c===listenState.cat?" on":"")+'" data-c="'+esc(c)+'">'+esc(c)+'</span>';}).join("")+'</div>';
  var pr=el(pills);
  pr.querySelectorAll(".pill").forEach(function(p){
    p.onclick=function(){ listenState.cat=p.dataset.c; renderListening(); };
  });
  appEl.appendChild(pr);
  var qhtml=t.questions.map(function(qq,qi){
    return '<div class="lq" data-qi="'+qi+'"><div style="font-weight:600;margin-top:12px">'+(qi+1)+'. '+esc(qq.q)+'</div>'+
      qq.options.map(function(o,oi){
        return '<label class="opt"><input type="radio" name="q'+qi+'" value="'+oi+'"> '+esc(o)+'</label>';
      }).join("")+
      '<div class="lexplain muted" style="display:none;font-size:13px;margin-top:4px"></div></div>';
  }).join("");
  var card=el('<div class="card">'+
    '<span class="tag">'+esc(t.category)+'</span> <span class="muted">'+diffDots(t.difficulty)+'</span>'+
    '<div class="qtext">'+esc(t.title)+'</div>'+
    (t.basedOn?'<div class="muted" style="font-size:12px">'+esc(t.basedOn)+'</div>':'')+
    '<div class="btnrow">'+
      '<button class="btn" id="playBtn">▶ Прослушать</button>'+
      '<button class="btn sec" id="stopBtn">⏹</button>'+
      '<select id="rateSel" style="width:auto"><option value="0.75">0.75×</option><option value="0.9">0.9×</option><option value="1">1×</option><option value="1.15">1.15×</option></select>'+
    '</div>'+
    '<div class="muted" style="font-size:13px;margin-top:6px">Слушайте, не глядя в текст. Транскрипт откроется после проверки.</div>'+
    qhtml+
    '<div class="btnrow"><button class="btn" id="gradeBtn">Проверить ответы</button>'+
    '<button class="btn sec" id="nextBtn">Другой диалог</button></div>'+
    '<div id="resBox"></div>'+
    '<div id="trsBox" style="display:none"></div>'+
  '</div>');
  appEl.appendChild(card);
  card.querySelector("#rateSel").value=String(listenState.rate);
  card.querySelector("#rateSel").onchange=function(){ listenState.rate=parseFloat(this.value); };
  card.querySelector("#playBtn").onclick=function(){ playDialog(t.dialog,listenState.rate); };
  card.querySelector("#stopBtn").onclick=function(){ speechSynthesis.cancel(); };
  card.querySelector("#nextBtn").onclick=function(){ renderListening(); };
  card.querySelector("#gradeBtn").onclick=function(){
    var correct=0, answered=0;
    t.questions.forEach(function(qq,qi){
      var sel=card.querySelector('input[name="q'+qi+'"]:checked');
      var block=card.querySelector('.lq[data-qi="'+qi+'"]');
      var exp=block.querySelector(".lexplain");
      if(!sel){ exp.innerHTML='<span class="err">Нет ответа.</span> '+esc(qq.explain); exp.style.display=""; return; }
      answered++;
      var ok=parseInt(sel.value,10)===qq.correct;
      if(ok)correct++;
      exp.innerHTML=(ok?'<span style="color:var(--good)">✓ Верно.</span> ':'<span class="err">✗ Неверно.</span> Правильно: «'+esc(qq.options[qq.correct])+'». ')+esc(qq.explain);
      exp.style.display="";
    });
    listenStats[t.id]={score:correct,total:t.questions.length,ts:Date.now()};
    saveJSON("icao4_listening",listenStats);
    dailyDone(t.id);
    var res=card.querySelector("#resBox");
    res.innerHTML='<div class="overall">Результат: <span class="'+(correct===t.questions.length?"s-good":(correct>=2?"s-warn":"s-bad"))+'">'+correct+' / '+t.questions.length+'</span></div>';
    var trs=card.querySelector("#trsBox");
    var lines=t.dialog.map(function(l){return '<div class="phrase"><b>'+esc(l.speaker)+':</b> '+esc(l.text)+'</div>';}).join("");
    var kp=(t.keyPhrases||[]).map(function(k){return '<span class="tag">'+esc(k)+'</span>';}).join("");
    trs.innerHTML='<h3 class="sub">Транскрипт</h3>'+lines+
      '<div class="btnrow" style="margin-top:8px"><button class="btn sec small" id="trTrs">🇷🇺 Перевод</button></div>'+
      '<div id="trTrsBox" class="trbox" style="display:none"></div>'+
      (kp?'<h3 class="sub">Ключевые фразы</h3><div>'+kp+'</div>':'');
    trs.style.display="";
    trs.querySelector("#trTrs").onclick=function(){
      var full=t.dialog.map(function(l){return l.speaker+": "+l.text;}).join("\n");
      toggleTranslate(t.id+":d",full,trs.querySelector("#trTrsBox"),this);
    };
  };
}

/* ---------- phrases ---------- */
function renderPhrases(){
  setScreen("Phrase Bank",true);
  PHRASES.forEach(function(g){
    var d=el('<details><summary>'+esc(g.group)+' <span class="muted">('+g.phrases.length+')</span></summary>'+
      '<div class="inner">'+g.phrases.map(function(p){
        return '<div class="phrase"><b>'+esc(p.phrase)+'</b><div class="ex">'+esc(p.example)+'</div></div>';
      }).join("")+'</div></details>');
    appEl.appendChild(d);
  });
}

/* ---------- vocabulary ---------- */
var vocabView={cat:"Все",idx:0,flipped:false};
function vocabCats(){ var s=[]; VOCAB.forEach(function(v){ if(s.indexOf(v.category)<0)s.push(v.category); }); return ["Сегодня","Все","Повторить"].concat(s); }
function vocabPool(){
  if(vocabView.cat==="Сегодня"){ var d=getDaily(); return VOCAB.filter(function(v){return d.words.indexOf(v.word)>=0;}); }
  if(vocabView.cat==="Все") return VOCAB;
  if(vocabView.cat==="Повторить") return VOCAB.filter(function(v){return vocabState[v.word]==="learn";});
  return VOCAB.filter(function(v){return v.category===vocabView.cat;});
}
function renderVocab(){
  setScreen("Vocabulary",true);
  var pills='<div class="pill-row">'+vocabCats().map(function(c){
    return '<span class="pill'+(c===vocabView.cat?" on":"")+'" data-c="'+esc(c)+'">'+esc(c)+'</span>';}).join("")+'</div>';
  var pr=el(pills);
  pr.querySelectorAll(".pill").forEach(function(p){
    p.onclick=function(){ vocabView.cat=p.dataset.c; vocabView.idx=0; vocabView.flipped=false; renderVocab(); };
  });
  appEl.appendChild(pr);
  var pool=vocabPool();
  if(!pool.length){ appEl.appendChild(el('<div class="card muted">Нет карточек. Отмечайте «Повторить», чтобы они появились здесь.</div>')); return; }
  if(vocabView.idx>=pool.length) vocabView.idx=0;
  var v=pool[vocabView.idx];
  var known=Object.keys(vocabState).filter(function(k){return vocabState[k]==="know";}).length;
  var inner=vocabView.flipped
    ? '<div class="cat">'+esc(v.category)+'</div><div class="tr">'+esc(v.translation)+'</div>'+
      '<div class="mean">'+esc(v.aviationMeaning)+'</div><div class="ex">'+esc(v.example)+'</div>'+
      (v.commonMistake?'<div class="mis">⚠ '+esc(v.commonMistake)+'</div>':'')
    : '<div class="cat">'+esc(v.category)+'</div><div class="w">'+esc(v.word)+'</div><div class="muted" style="margin-top:10px">нажмите, чтобы перевернуть</div>';
  var c=el('<div><div class="flashcard">'+inner+'</div>'+
    '<div class="btnrow">'+
    '<button class="btn sec small" id="vSay">🔊</button>'+
    '<button class="btn sec" id="vLearn">🔁 Повторить</button>'+
    '<button class="btn" id="vKnow">✓ Знаю</button>'+
    '</div>'+
    '<div class="muted" style="margin-top:10px">'+(vocabView.idx+1)+' / '+pool.length+' · выучено всего: '+known+' из '+VOCAB.length+'</div></div>');
  c.querySelector(".flashcard").onclick=function(){ vocabView.flipped=!vocabView.flipped; renderVocab(); };
  c.querySelector("#vSay").onclick=function(){ speak(v.word+". "+v.example); };
  c.querySelector("#vKnow").onclick=function(){ vocabState[v.word]="know"; saveJSON("icao4_vocab",vocabState); dailyWordDone(v.word); nextCard(pool); };
  c.querySelector("#vLearn").onclick=function(){ vocabState[v.word]="learn"; saveJSON("icao4_vocab",vocabState); dailyWordDone(v.word); nextCard(pool); };
  appEl.appendChild(c);
}
function nextCard(pool){ vocabView.idx=(vocabView.idx+1)%pool.length; vocabView.flipped=false; renderVocab(); }

/* ---------- progress ---------- */
function renderProgress(){
  setScreen("Прогресс",true);
  if(!attempts.length){ appEl.appendChild(el('<div class="card muted">Пока нет проверенных ответов. Пройдите Interview или Emergency.</div>')); return; }
  var last=attempts.slice(-20);
  var html='<div class="card"><b>Средние оценки (последние '+last.length+' ответов)</b>';
  CRITERIA.forEach(function(c){
    var vals=last.map(function(a){return a.scores&&a.scores[c.key];}).filter(function(x){return typeof x==="number";});
    if(!vals.length)return;
    var avg=vals.reduce(function(a,b){return a+b;},0)/vals.length;
    html+='<div style="margin-top:10px"><span>'+c.label+'</span> <b class="'+scoreClass(avg)+'" style="float:right">'+avg.toFixed(1)+'</b>'+
      '<div class="progress-bar"><div style="width:'+(avg/6*100)+'%"></div></div></div>';
  });
  html+='</div>';
  appEl.appendChild(el(html));
  var passCnt=last.filter(function(a){return a.overall>=4;}).length;
  appEl.appendChild(el('<div class="card"><b>Прогноз</b><div class="muted" style="margin-top:6px">Level ≥ 4 в '+passCnt+' из '+last.length+' последних ответов ('+Math.round(passCnt/last.length*100)+'%). Стабильно сдаёте, когда ≥ 80%.</div></div>'));
  var lsIds=Object.keys(listenStats);
  if(lsIds.length){
    var lc=0,lt=0;
    lsIds.forEach(function(k){ lc+=listenStats[k].score; lt+=listenStats[k].total; });
    appEl.appendChild(el('<div class="card"><b>Listening</b><div class="muted" style="margin-top:6px">Пройдено диалогов: '+lsIds.length+' из '+LISTENING.length+' · правильных ответов: '+Math.round(lc/lt*100)+'%</div></div>'));
  }
  var rtIds=Object.keys(rtStats);
  if(rtIds.length){
    var rsum=0; rtIds.forEach(function(k){ rsum+=rtStats[k].pct; });
    appEl.appendChild(el('<div class="card"><b>Радиосвязь</b><div class="muted" style="margin-top:6px">Пройдено сценариев: '+rtIds.length+' из '+RT.length+' · средний результат: '+Math.round(rsum/rtIds.length)+'%</div></div>'));
  }
  if(dailyMeta.streak>0)
    appEl.appendChild(el('<div class="card"><b>🔥 Стрик</b><div class="muted" style="margin-top:6px">'+dailyMeta.streak+' дн. подряд с выполненным планом (последний: '+esc(dailyMeta.lastDone)+')</div></div>'));
  var bars="", names=["Вс","Пн","Вт","Ср","Чт","Пт","Сб"], maxMin=settings.minMinutes;
  var week=[];
  for(var di=6;di>=0;di--){
    var dd=new Date(Date.now()-di*86400000);
    var kk=dd.getFullYear()+"-"+("0"+(dd.getMonth()+1)).slice(-2)+"-"+("0"+dd.getDate()).slice(-2);
    var mm=Math.floor((timeStats[kk]||0)/60);
    if(mm>maxMin)maxMin=mm;
    week.push({name:names[dd.getDay()],min:mm});
  }
  week.forEach(function(x){
    var h=Math.max(3,Math.round(x.min/maxMin*60));
    var ok=x.min>=settings.minMinutes;
    bars+='<div style="flex:1;text-align:center"><div style="font-size:11px;color:var(--muted)">'+x.min+'</div>'+
      '<div style="height:60px;display:flex;align-items:flex-end"><div style="width:70%;margin:0 auto;height:'+h+'px;border-radius:4px 4px 0 0;background:'+(ok?"var(--good)":"var(--card2)")+'"></div></div>'+
      '<div style="font-size:11px;color:var(--muted)">'+x.name+'</div></div>';
  });
  appEl.appendChild(el('<div class="card"><b>⏱ Время занятий за неделю</b> <span class="muted">(цель: '+settings.minMinutes+' мин/день)</span>'+
    '<div style="display:flex;gap:4px;margin-top:10px">'+bars+'</div></div>'));
  var hist='<div class="card"><b>История</b>'+attempts.slice(-30).reverse().map(function(a){
    var d=new Date(a.ts);
    return '<div class="attempt"><b class="'+scoreClass(a.overall)+'">L'+a.overall+'</b> · '+esc(a.mode)+' · '+esc(a.qid)+' · <span class="muted">'+d.toLocaleDateString()+' '+d.toLocaleTimeString().slice(0,5)+'</span></div>';
  }).join("")+'</div>';
  appEl.appendChild(el(hist));
}

/* ---------- settings ---------- */
function renderSettings(){
  setScreen("Настройки",true);
  var c=el('<div class="card">'+
    '<label>AI-провайдер</label>'+
    '<select id="sProv"><option value="anthropic">Anthropic (Claude)</option><option value="openai">OpenAI</option></select>'+
    '<label>API-ключ</label><input id="sKey" type="password" placeholder="sk-...">'+
    '<label>Модель (пусто = по умолчанию: claude-sonnet-5 / gpt-4o-mini)</label><input id="sModel" placeholder="claude-sonnet-5">'+
    '<label>Профиль пилота (AI использует его при оценке и в образцах)</label>'+
    '<textarea id="sProfile"></textarea>'+
    '<label>Минимум занятий в день, минут (для зачёта дня и стрика)</label>'+
    '<input id="sMin" type="number" min="5" max="180" step="5">'+
    '<label>Напоминание заниматься (работает в установленном приложении с сайта)</label>'+
    '<div style="display:flex;gap:10px;align-items:center">'+
    '<select id="sRemOn" style="flex:1"><option value="on">Включено</option><option value="off">Выключено</option></select>'+
    '<select id="sRemHour" style="flex:1"></select>'+
    '<button class="btn sec small" id="sNotifTest" style="white-space:nowrap">Тест 🔔</button></div>'+
    '<div class="btnrow"><button class="btn" id="sSave">Сохранить</button>'+
    '<button class="btn sec" id="sClear">Сбросить прогресс</button></div>'+
    '<label>Перенос прогресса между устройствами (телефон ↔ компьютер)</label>'+
    '<div class="btnrow" style="margin-top:4px"><button class="btn sec" id="sExport">⬇ Экспорт прогресса</button>'+
    '<button class="btn sec" id="sImport">⬆ Импорт</button></div>'+
    '<input type="file" id="sImportFile" accept=".json,application/json" style="display:none">'+
    '<div class="muted" style="font-size:13px;margin-top:6px">Chrome не синхронизирует данные приложения между устройствами. Экспортируйте файл, перекиньте (Telegram/почта) и импортируйте на другом устройстве. Прогресс объединится с текущим (импорт перезаписывает).</div>'+
    '<div class="muted" id="sMsg" style="margin-top:8px"></div>'+
    '<div class="muted" style="margin-top:12px;font-size:13px">Ключ хранится только на этом устройстве (localStorage) и отправляется напрямую в API провайдера. Ключ Anthropic: console.anthropic.com → API Keys. Ключ OpenAI: platform.openai.com.<br><br>Голосовой ввод: Chrome на Android, нужен доступ к микрофону. Для Picture-режима AI получает саму картинку (vision).</div>'+
  '</div>');
  c.querySelector("#sProv").value=settings.provider;
  c.querySelector("#sKey").value=settings.apiKey;
  c.querySelector("#sModel").value=settings.model;
  c.querySelector("#sProfile").value=settings.profile;
  c.querySelector("#sMin").value=settings.minMinutes;
  var hourSel=c.querySelector("#sRemHour");
  for(var h=6;h<=23;h++){ var o=document.createElement("option"); o.value=h; o.textContent=("0"+h).slice(-2)+":00"; hourSel.appendChild(o); }
  hourSel.value=settings.reminderHour;
  c.querySelector("#sRemOn").value=settings.reminderOn!==false?"on":"off";
  c.querySelector("#sNotifTest").onclick=function(){
    var msgEl=c.querySelector("#sMsg");
    askNotifPermission(function(p){
      if(p==="granted"){
        if(swReg) swReg.showNotification("ICAO 4 Trainer ✈️",{body:"Уведомления работают! Напоминание придёт после "+("0"+settings.reminderHour).slice(-2)+":00.",icon:"icon-192.png"});
        else try{ new Notification("ICAO 4 Trainer ✈️",{body:"Уведомления работают!"}); }catch(e){ msgEl.textContent="Уведомления доступны только в установленном приложении (PWA с сайта)."; return; }
        msgEl.textContent="Тестовое уведомление отправлено ✓";
      } else if(p==="unsupported") msgEl.textContent="Этот браузер не поддерживает уведомления.";
      else msgEl.textContent="Разрешение на уведомления не дано. Разрешите в настройках сайта.";
    });
  };
  c.querySelector("#sSave").onclick=function(){
    settings.provider=c.querySelector("#sProv").value;
    settings.apiKey=c.querySelector("#sKey").value.trim();
    settings.model=c.querySelector("#sModel").value.trim();
    settings.profile=c.querySelector("#sProfile").value.trim()||DEFAULT_PROFILE;
    settings.minMinutes=Math.max(5,parseInt(c.querySelector("#sMin").value,10)||20);
    settings.reminderOn=c.querySelector("#sRemOn").value==="on";
    settings.reminderHour=parseInt(c.querySelector("#sRemHour").value,10);
    saveJSON("icao4_settings",settings);
    if(settings.reminderOn&&IS_PWA){ askNotifPermission(function(){ sendReminderCfg(); registerPeriodic(); }); }
    else sendReminderCfg();
    c.querySelector("#sMsg").textContent="Сохранено ✓";
  };
  c.querySelector("#sExport").onclick=function(){
    var dump={};
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k.indexOf("icao4_")===0) dump[k]=localStorage.getItem(k);
    }
    var blob=new Blob([JSON.stringify(dump)],{type:"application/json"});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="icao4_progress_"+todayStr()+".json";
    a.click();
    URL.revokeObjectURL(a.href);
    c.querySelector("#sMsg").textContent="Файл прогресса сохранён ⬇";
  };
  c.querySelector("#sImport").onclick=function(){ c.querySelector("#sImportFile").click(); };
  c.querySelector("#sImportFile").onchange=function(){
    var f=this.files[0]; if(!f)return;
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var dump=JSON.parse(rd.result), n=0;
        Object.keys(dump).forEach(function(k){
          if(k.indexOf("icao4_")===0){ localStorage.setItem(k,dump[k]); n++; }
        });
        c.querySelector("#sMsg").textContent="Импортировано ("+n+" разделов). Перезагружаю…";
        setTimeout(function(){ location.reload(); },800);
      }catch(e){ c.querySelector("#sMsg").textContent="Ошибка: файл не похож на экспорт прогресса"; }
    };
    rd.readAsText(f);
  };
  c.querySelector("#sClear").onclick=function(){
    if(confirm("Удалить весь прогресс (ответы и словарь)?")){
      attempts=[]; vocabState={}; listenStats={}; rtStats={}; daily=null; dailyMeta={streak:0,lastDone:null};
      saveJSON("icao4_attempts",attempts); saveJSON("icao4_vocab",vocabState); saveJSON("icao4_listening",listenStats);
      saveJSON("icao4_rt",rtStats); localStorage.removeItem("icao4_daily"); saveJSON("icao4_daily_meta",dailyMeta);
      c.querySelector("#sMsg").textContent="Прогресс сброшен";
    }
  };
  appEl.appendChild(c);
}

renderHome();

</script>
